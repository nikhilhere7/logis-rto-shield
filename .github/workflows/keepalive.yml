name: Keep Logis API Awake

on:
  schedule:
    - cron: "23 4 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "GitHub Actions variable API_URL is not configured."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            "$API_URL/api/health/"
